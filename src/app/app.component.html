<!-- Barra de navegación superior -->
<mat-toolbar color="primary">
  <span>{{ title }}</span> <!-- Muestra el título que definimos en el componente TS -->

  <!-- Botón para ver la lista de tareas -->
  <button mat-button routerLink="/tareas">
    <mat-icon>list</mat-icon> Tareas
  </button>

  <!-- Botón para crear una nueva tarea -->
  <button mat-button routerLink="/tareas/nueva">
    <mat-icon>add</mat-icon> Nueva
  </button>
</mat-toolbar>

<!-- Esta es la zona donde cambiaremos el contenido cuando naveguemos -->
